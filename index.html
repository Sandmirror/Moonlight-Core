<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRRORS OS // DESKTOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- CORE OS STYLING --- */
        body {
            background-color: #050510;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; 
            color: #e2e8f0;
            touch-action: none;
        }

        /* 1. THE GRID BACKGROUND */
        .os-grid {
            position: fixed;
            top: -50%; left: -50%; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(60deg);
            z-index: 0;
            pointer-events: none;
        }

        /* 2. GLASS WINDOWS (Optimized for ChromeOS) */
        .os-window {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            position: absolute;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .active-window { z-index: 50; border-color: rgba(6, 182, 212, 0.8); }
        .inactive-window { z-index: 10; opacity: 0.9; }

        /* 3. TASKBAR */
        .taskbar {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 48px;
            background: rgba(10, 10, 20, 0.9);
            border-top: 1px solid rgba(6, 182, 212, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* 4. UTILITIES */
        .drag-handle { cursor: move; user-select: none; }
        
        /* Input Reset */
        input { 
            background: transparent; 
            outline: none; 
            color: #22d3ee; 
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #0891b2; }
    </style>
</head>
<body>

    <div class="os-grid"></div>

    <div class="absolute top-8 left-8 space-y-6 z-0">
        <div class="flex flex-col items-center gap-2 opacity-80 hover:opacity-100 cursor-pointer">
            <div class="w-12 h-12 border border-cyan-500/50 bg-cyan-900/20 flex items-center justify-center rounded">
                <span class="text-2xl">_></span>
            </div>
            <span class="text-xs tracking-widest text-cyan-500">TERMINAL</span>
        </div>
        <div class="flex flex-col items-center gap-2 opacity-50 cursor-not-allowed">
            <div class="w-12 h-12 border border-slate-700 bg-slate-900/20 flex items-center justify-center rounded">
                <span class="text-2xl">◈</span>
            </div>
            <span class="text-xs tracking-widest text-slate-500">MARKET</span>
        </div>
        <div class="flex flex-col items-center gap-2 opacity-50 cursor-not-allowed">
            <div class="w-12 h-12 border border-slate-700 bg-slate-900/20 flex items-center justify-center rounded">
                <span class="text-2xl">≡</span>
            </div>
            <span class="text-xs tracking-widest text-slate-500">LOGS</span>
        </div>
    </div>

    <div id="win-terminal" class="os-window active-window w-[700px] h-[500px]" style="top: 80px; left: 120px;">
        <div class="drag-handle bg-slate-900 border-b border-cyan-900/50 p-2 flex justify-between items-center">
            <div class="flex items-center gap-2 pl-2">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                <span class="text-xs font-bold text-cyan-400 tracking-[0.2em]">MOONLIGHT_TERMINAL</span>
            </div>
            <div class="flex gap-1 pr-2">
                <div class="w-3 h-3 border border-slate-600"></div>
                <div class="w-3 h-3 border border-slate-600 bg-slate-800"></div>
            </div>
        </div>

        <div id="chat-output" class="flex-1 bg-black/40 p-4 overflow-y-auto font-mono text-sm space-y-2">
            <div class="text-slate-500 mb-4">
                Mirrors OS [Version 1.0.4]<br>
                (c) 2026 Moonlight Corp. All rights reserved.<br><br>
                > SYSTEM READY.<br>
                > SECURE CONNECTION ESTABLISHED.
            </div>
        </div>

        <div class="h-12 bg-slate-900 border-t border-cyan-900/50 flex items-center px-4 gap-2">
            <span class="text-cyan-500 font-bold">>></span>
            <input type="text" id="user-input" class="flex-1 h-full" placeholder="Enter command..." autocomplete="off">
            <button onclick="sendChat()" class="text-cyan-600 hover:text-cyan-400 text-xl font-bold">↵</button>
        </div>
    </div>

    <div id="win-status" class="os-window inactive-window w-[300px] h-[250px]" style="top: 80px; left: 850px;">
        <div class="drag-handle bg-slate-900 border-b border-slate-700 p-2">
            <span class="text-xs font-bold text-slate-400 tracking-widest pl-2">DIAGNOSTICS</span>
        </div>
        <div class="p-4 space-y-4 bg-black/20 text-xs font-mono">
            <div>
                <div class="flex justify-between text-slate-400 mb-1"><span>CPU LOAD</span><span>12%</span></div>
                <div class="w-full h-1 bg-slate-800"><div class="h-full w-[12%] bg-emerald-500"></div></div>
            </div>
            <div>
                <div class="flex justify-between text-slate-400 mb-1"><span>MEMORY</span><span>4.2GB</span></div>
                <div class="w-full h-1 bg-slate-800"><div class="h-full w-[45%] bg-cyan-600"></div></div>
            </div>
            <div>
                <div class="flex justify-between text-slate-400 mb-1"><span>GRID LATENCY</span><span>24ms</span></div>
                <div class="w-full h-1 bg-slate-800"><div class="h-full w-[80%] bg-purple-500 animate-pulse"></div></div>
            </div>
            <div class="pt-4 text-slate-600 text-center uppercase tracking-widest">
                System Stable
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="flex items-center gap-4">
            <div class="px-3 py-1 bg-cyan-900/30 border border-cyan-500/50 rounded text-cyan-400 text-xs font-bold tracking-widest hover:bg-cyan-500 hover:text-black cursor-pointer transition-colors">
                [ START ]
            </div>
            <div class="h-4 w-[1px] bg-slate-700"></div>
            <div class="text-xs text-slate-400 hover:text-cyan-400 cursor-pointer">Terminal</div>
        </div>
        <div class="text-xs text-slate-500 font-mono" id="clock">00:00:00</div>
    </div>

    <script src="config.js"></script>
    <script>
        // --- 1. CLOCK ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        // --- 2. DRAGGABLE WINDOWS (Universal) ---
        function makeDraggable(el) {
            const handle = el.querySelector('.drag-handle');
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            handle.onmousedown = dragMouseDown;
            handle.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDrag;
                document.onmousemove = elementDrag;
                bringToFront(el);
            }

            function dragTouchStart(e) {
                const touch = e.touches[0];
                pos3 = touch.clientX; pos4 = touch.clientY;
                document.ontouchend = closeDrag;
                document.ontouchmove = elementTouchDrag;
                bringToFront(el);
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - pos1) + "px";
            }

            function elementTouchDrag(e) {
                const touch = e.touches[0];
                pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX; pos4 = touch.clientY;
                el.style.top = (el.offsetTop - pos2) + "px";
                el.style.left = (el.offsetLeft - pos1) + "px";
            }

            function closeDrag() {
                document.onmouseup = null; document.onmousemove = null;
                document.ontouchend = null; document.ontouchmove = null;
            }
        }

        function bringToFront(el) {
            document.querySelectorAll('.os-window').forEach(w => {
                w.classList.remove('active-window');
                w.classList.add('inactive-window');
            });
            el.classList.remove('inactive-window');
            el.classList.add('active-window');
        }

        // Initialize Windows
        makeDraggable(document.getElementById('win-terminal'));
        makeDraggable(document.getElementById('win-status'));

        // --- 3. CHAT LOGIC ---
        const userInput = document.getElementById('user-input');
        
        // Aggressive Enter Key Listener
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        async function sendChat() {
            const text = userInput.value.trim();
            if (!text) return;

            const output = document.getElementById('chat-output');
            
            // User Msg
            output.innerHTML += `<div class="text-cyan-200"><span class="text-slate-500 mr-2">>></span>${text}</div>`;
            userInput.value = '';
            output.scrollTop = output.scrollHeight;

            // Loader
            const loader = document.createElement('div');
            loader.className = "text-cyan-600 text-xs animate-pulse mt-1";
            loader.innerText = "[ PROCESSING... ]";
            output.appendChild(loader);

            try {
                // Config Check
                let key = "";
                try { key = SECRET_CONFIG.API_KEY; } catch(e) { throw new Error("config.js missing"); }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: "You are the MOONLIGHT OS. Be concise." }] }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                loader.remove();
                const reply = data.candidates[0].content.parts[0].text;
                output.innerHTML += `<div class="text-slate-300 mt-1 mb-3 pl-4 border-l border-cyan-900">${reply}</div>`;

            } catch (err) {
                loader.innerText = `ERR: ${err.message}`;
                loader.className = "text-red-500 text-xs";
            }
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
