<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRRORS OS // BETA 1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #050510; font-family: 'JetBrains Mono', monospace; overflow: hidden; color: #e2e8f0; }
        .os-grid { position: fixed; top: -50%; left: -50%; width: 200vw; height: 200vh; background-image: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px); background-size: 60px 60px; transform: perspective(500px) rotateX(60deg); z-index: 0; pointer-events: none; }
        
        .os-window { background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(6, 182, 212, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-radius: 4px; position: absolute; display: none; flex-direction: column; overflow: hidden; }
        .active-window { border-color: rgba(6, 182, 212, 1); box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
        
        .drag-handle { cursor: move; user-select: none; }
        .taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 48px; background: rgba(10, 10, 20, 0.98); border-top: 1px solid rgba(6, 182, 212, 0.3); z-index: 9999; display: flex; align-items: center; padding: 0 20px; gap: 15px; }
        
        .desktop-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; transition: all 0.2s; cursor: pointer; }
        .desktop-icon:hover .icon-box { background: rgba(6, 182, 212, 0.2); border-color: rgba(6, 182, 212, 0.6); }
        .icon-box { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 24px; }
    </style>
</head>
<body>
    <div class="os-grid"></div>

    <div class="absolute top-10 left-10 grid grid-cols-1 gap-8 z-10">
        <div onclick="openApp('win-mypc')" class="desktop-icon">
            <div class="icon-box text-blue-400">🖥️</div>
            <span class="text-[10px] tracking-widest text-slate-400 font-bold uppercase">My PC</span>
        </div>
        <div onclick="openApp('win-github')" class="desktop-icon">
            <div class="icon-box text-white">🐙</div>
            <span class="text-[10px] tracking-widest text-slate-400 font-bold uppercase">GitHub</span>
        </div>
        <div onclick="openApp('win-youtube')" class="desktop-icon">
            <div class="icon-box text-red-500">📺</div>
            <span class="text-[10px] tracking-widest text-slate-400 font-bold uppercase">YouTube</span>
        </div>
        <div onclick="openApp('win-trash')" class="desktop-icon">
            <div class="icon-box text-slate-500">🗑️</div>
            <span class="text-[10px] tracking-widest text-slate-400 font-bold uppercase">Trash</span>
        </div>
    </div>

    <div id="win-mypc" class="os-window w-[400px] h-[300px]" style="top: 150px; left: 300px;">
        <div class="drag-handle bg-slate-900 p-2 flex justify-between border-b border-blue-900/50">
            <span class="text-[10px] font-bold text-blue-400 tracking-widest pl-2">SYSTEM_IDENTITY</span>
            <button onclick="closeApp('win-mypc')" class="px-2 text-slate-500 hover:text-red-500">✕</button>
        </div>
        <div class="p-6 space-y-4 text-xs font-mono">
            <p><span class="text-blue-500">OWNER:</span> Mitch Virginia [cite: 137]</p>
            <p><span class="text-blue-500">OS_KERN:</span> Mirrors V2.1 [cite: 609]</p>
            <p><span class="text-blue-500">PROTOCOL:</span> Moonlight Sovereign [cite: 610]</p>
            <p><span class="text-blue-500">UPTIME:</span> <span id="uptime">00:00:00</span></p>
        </div>
    </div>

    <div id="win-youtube" class="os-window w-[800px] h-[500px]" style="top: 50px; left: 400px;">
        <div class="drag-handle bg-slate-900 p-2 flex justify-between border-b border-red-900/50">
            <span class="text-[10px] font-bold text-red-500 tracking-widest pl-2">YOUTUBE_RESONANCE</span>
            <button onclick="closeApp('win-youtube')" class="px-2 text-slate-500 hover:text-red-500">✕</button>
        </div>
        <iframe class="w-full h-full" src="https://www.youtube.com/embed/YOd2YSryGnU" frameborder="0" allowfullscreen></iframe>
    </div>

    <div id="win-github" class="os-window w-[900px] h-[600px]" style="top: 80px; left: 250px;">
        <div class="drag-handle bg-slate-900 p-2 flex justify-between border-b border-slate-700">
            <span class="text-[10px] font-bold text-slate-300 tracking-widest pl-2">GITHUB_WORKSPACE</span>
            <button onclick="closeApp('win-github')" class="px-2 text-slate-500 hover:text-red-500">✕</button>
        </div>
        <iframe class="w-full h-full" src="https://github.com/features/codespaces" frameborder="0"></iframe>
    </div>

    <div id="win-trash" class="os-window w-[350px] h-[250px]" style="top: 250px; left: 500px;">
        <div class="drag-handle bg-slate-900 p-2 flex justify-between border-b border-slate-700">
            <span class="text-[10px] font-bold text-slate-500 tracking-widest pl-2">RECYCLED_VOID</span>
            <button onclick="closeApp('win-trash')" class="px-2 text-slate-500 hover:text-red-500">✕</button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center text-slate-600 italic text-[10px]">
            <span>The void is currently empty.</span>
        </div>
    </div>

    <div class="taskbar">
        <div class="px-3 py-1 bg-cyan-900/30 border border-cyan-500/50 rounded text-cyan-400 text-[10px] font-bold tracking-[0.2em] cursor-pointer hover:bg-cyan-500 hover:text-black transition-all">START</div>
        <div class="text-[10px] text-slate-500 font-mono" id="clock">00:00:00</div>
    </div>

    <script>
        let highestZ = 100;

        function openApp(id) {
            const win = document.getElementById(id);
            if(!win) return;
            win.style.display = 'flex';
            focusWindow(win);
        }

        function closeApp(id) {
            document.getElementById(id).style.display = 'none';
        }

        function focusWindow(win) {
            highestZ++;
            win.style.zIndex = highestZ;
            document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active-window'));
            win.classList.add('active-window');
        }

        // Draggable & Focus Implementation
        document.querySelectorAll('.os-window').forEach(win => {
            const handle = win.querySelector('.drag-handle');
            win.addEventListener('mousedown', () => focusWindow(win));
            handle.onmousedown = (e) => {
                let shiftX = e.clientX - win.getBoundingClientRect().left;
                let shiftY = e.clientY - win.getBoundingClientRect().top;
                document.onmousemove = (e) => {
                    win.style.left = e.clientX - shiftX + 'px';
                    win.style.top = e.clientY - shiftY + 'px';
                };
                document.onmouseup = () => document.onmousemove = null;
            };
        });

        // System Timers
        let seconds = 0;
        setInterval(() => {
            seconds++;
            let h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            let m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            if(document.getElementById('uptime')) document.getElementById('uptime').innerText = `${h}:${m}:${s}`;
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
