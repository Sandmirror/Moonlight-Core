<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOONLIGHT // OS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- CORE PHYSICS & AESTHETICS --- */
        body {
            background-color: #050510;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; /* No scrollbars on the main screen */
            color: #e2e8f0;
        }

        /* THE INFINITE GRID BACKGROUND */
        .moonlight-grid {
            position: fixed;
            top: 0; left: 0; width: 200vw; height: 200vh;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridScan 20s linear infinite;
            z-index: -1;
            pointer-events: none; /* Let clicks pass through */
        }
        
        .moonlight-horizon {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(5, 5, 16, 0) 0%, #050510 80%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gridScan {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        /* GLASS WINDOW (The Draggable Container) */
        .glass-window {
            background: rgba(15, 23, 42, 0.6); /* Semi-transparent dark blue */
            backdrop-filter: blur(12px); /* The "Frosted Glass" effect */
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            position: absolute; /* Allows movement */
            transition: box-shadow 0.2s ease;
        }

        .glass-window:active {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            border-color: rgba(0, 255, 255, 0.5);
        }

        /* DRAG HANDLE */
        .drag-handle {
            cursor: move; /* Shows the "move" icon */
            user-select: none;
        }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

        /* TYPOGRAPHY */
        .font-header { font-family: 'Orbitron', sans-serif; }
        .text-neon { text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); }
    </style>
</head>
<body>

    <div class="moonlight-grid"></div>
    <div class="moonlight-horizon"></div>

    <div id="main-interface" class="glass-window w-[800px] h-[600px]" style="top: 10%; left: 20%;">
        
        <div class="drag-handle flex justify-between items-center p-3 bg-slate-900/50 border-b border-cyan-500/30 rounded-t-lg">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-cyan-500 animate-pulse"></div>
                <span class="font-header text-cyan-400 tracking-widest text-sm">:: MOONLIGHT PROTOCOL ::</span>
            </div>
            <div class="text-xs text-slate-500">SYS.VER.2.5.0</div>
        </div>

        <div class="flex flex-col h-[calc(100%-50px)]">
            
            <div id="chat-interface" class="flex-1 p-4 overflow-y-auto space-y-4 font-mono text-sm">
                <div class="text-slate-400 border-l-2 border-cyan-900 pl-3">
                    <span class="text-cyan-600">>></span> SYSTEM ONLINE.<br>
                    <span class="text-cyan-600">>></span> TPLINK GRID CONNECTION ESTABLISHED.<br>
                    <span class="text-cyan-600">>></span> WAITING FOR INPUT...
                </div>
            </div>

            <div class="p-4 bg-slate-900/30 border-t border-cyan-500/20 rounded-b-lg">
                <div class="relative">
                    <input 
                        type="text" 
                        id="user-input" 
                        class="w-full bg-slate-800/50 border border-slate-600 text-cyan-100 p-3 pl-4 rounded focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all font-mono placeholder-slate-600"
                        placeholder="ENTER COMMAND OR QUERY..."
                        onkeydown="handleEnter(event)"
                    >
                    <button onclick="sendChat()" class="absolute right-2 top-2 text-slate-400 hover:text-cyan-400 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-between mt-2 text-[10px] text-slate-600 uppercase tracking-wider">
                    <span>Secure Channel [Encrypted]</span>
                    <span id="status-indicator" class="text-emerald-500">● Connected</span>
                </div>
            </div>

        </div>
    </div>

    <script src="config.js"></script>

    <script>
        // --- 1. PHYSICS ENGINE (DRAG & DROP) ---
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = element.querySelector(".drag-handle");
            
            if (header) {
                header.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                // Visual feedback
                element.style.transition = "none";
                element.style.zIndex = 100; // Bring to front
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Initialize Physics on Main Interface
        makeDraggable(document.getElementById("main-interface"));


        // --- 2. AI CORE (GEMINI CONNECTION) ---
        
        // SECURE KEY LOADING
        let apiKey = "";
        try {
            apiKey = SECRET_CONFIG.API_KEY;
        } catch (e) {
            console.error("CONFIG ERROR: config.js not found or invalid.");
            document.getElementById('status-indicator').innerText = "● KEY MISSING";
            document.getElementById('status-indicator').className = "text-red-500";
        }

        const model = "gemini-2.5-flash-preview-09-2025";

        // Main Interaction Logic
        async function handleEnter(e) {
            if (e.key === "Enter") sendChat();
        }

        async function sendChat() {
            const inputField = document.getElementById('user-input');
            const chatOutput = document.getElementById('chat-interface');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // 1. Add User Message to UI
            appendMessage("USER", prompt, "text-slate-300");
            inputField.value = "";

            // 2. Add Loading Indicator
            const loadingId = "load-" + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = "text-cyan-600 animate-pulse text-xs mt-2";
            loadingDiv.innerText = ">> PROCESSING TPLINK REQUEST...";
            chatOutput.appendChild(loadingDiv);
            chatOutput.scrollTop = chatOutput.scrollHeight;

            try {
                // 3. Call Gemini API
                const response = await callGemini(prompt);
                
                // 4. Remove Loading & Add Response
                document.getElementById(loadingId).remove();
                appendMessage("MOONLIGHT", response, "text-cyan-400");

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("SYSTEM", "ERROR: " + error.message, "text-red-400");
            }
        }

        function appendMessage(sender, text, colorClass) {
            const output = document.getElementById('chat-interface');
            const msgDiv = document.createElement('div');
            msgDiv.className = `mb-4 ${colorClass}`;
            
            // Format: [SENDER] >> Message
            msgDiv.innerHTML = `<span class="text-[10px] uppercase opacity-50 block mb-1">[${sender}]</span><span class="leading-relaxed">${formatText(text)}</span>`;
            
            output.appendChild(msgDiv);
            output.scrollTop = output.scrollHeight;
        }

        // Simple formatter for bold text (**text**)
        function formatText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
